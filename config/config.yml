      - {id: GSM6556450, donor: CTRL_2, folder: GSM6556450_humanCTRL_2, condition: control}
      - {id: GSM6556451, donor: CTRL_3, folder: GSM6556451_humanCTRL_3, condition: control}
      - {id: GSM6556452, donor: NASH_1, folder: GSM6556452_humanNASH_1_40kNuclei_R1C1_DMSO, condition: disease}
      - {id: GSM6556453, donor: NASH_1, folder: GSM6556453_humanNASH_1_40kNuclei_R1C2_Flash, condition: disease}
      - {id: GSM6556454, donor: NASH_2, folder: GSM6556454_humanNASH_2_R1C1_30kNuclei, condition: disease}
      - {id: GSM6556455, donor: NASH_2, folder: GSM6556455_humanNASH_2_R2C1_30kNuclei, condition: disease}
      - {id: GSM6556456, donor: NASH_3, folder: GSM6556456_humanNASH_3_R4C1_30kNuclei, condition: disease}
      - {id: GSM6556457, donor: NASH_3, folder: GSM6556457_humanNASH_3_R5C2_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556458, donor: NASH_3, folder: GSM6556458_humanNASH_3_R6C1_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556459, donor: NASH_4, folder: GSM6556459_humanNASH_4_R4C1_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556460, donor: NASH_4, folder: GSM6556460_humanNASH_4_R6C1_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556461, donor: NASH_5, folder: GSM6556461_humanNASH_5_R3C8_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556462, donor: NASH_5, folder: GSM6556462_humanNASH_5_R5C5_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556463, donor: NASH_6, folder: GSM6556463_humanNASH_6, condition: disease}
      - {id: GSM6556464, donor: NASH_7, folder: GSM6556464_humanNASH_7, condition: disease}
      - {id: GSM6556465, donor: NASH_8, folder: GSM6556465_humanNASH_8, condition: disease}
      - {id: GSM6556466, donor: NASH_9, folder: GSM6556466_humanNASH_9, condition: disease}

  # Sensitivity analysis: Wang human without the five FACS-sorted NASH captures (about 0% mt),
  # since all controls are unsorted.
  wang_human_GSE212837_unsorted:
    species: human
    assay: snRNA-seq
    raw_dir: data/raw/GSE212837_Wang
    batch_var: capture
    output_dir: data/single_cell/sensitivity
    samples:
      - {id: GSM6556449, donor: CTRL_1, folder: GSM6556449_humanCTRL_1, condition: control}
      - {id: GSM6556450, donor: CTRL_2, folder: GSM6556450_humanCTRL_2, condition: control}
      - {id: GSM6556451, donor: CTRL_3, folder: GSM6556451_humanCTRL_3, condition: control}
      - {id: GSM6556457, donor: NASH_3, folder: GSM6556457_humanNASH_3_R5C2_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556458, donor: NASH_3, folder: GSM6556458_humanNASH_3_R6C1_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556459, donor: NASH_4, folder: GSM6556459_humanNASH_4_R4C1_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556460, donor: NASH_4, folder: GSM6556460_humanNASH_4_R6C1_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556461, donor: NASH_5, folder: GSM6556461_humanNASH_5_R3C8_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556462, donor: NASH_5, folder: GSM6556462_humanNASH_5_R5C5_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556463, donor: NASH_6, folder: GSM6556463_humanNASH_6, condition: disease}
      - {id: GSM6556464, donor: NASH_7, folder: GSM6556464_humanNASH_7, condition: disease}
      - {id: GSM6556465, donor: NASH_8, folder: GSM6556465_humanNASH_8, condition: disease}
      - {id: GSM6556466, donor: NASH_9, folder: GSM6556466_humanNASH_9, condition: disease}

  # Sensitivity analyses: Xiao and Wang with decontX ambient RNA correction (scripts/04c)
