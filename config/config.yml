      - {id: GSM6556461, donor: NASH_5, folder: GSM6556461_humanNASH_5_R3C8_20kNoFacsNuclei, condition: disease}
      - {id: GSM6556462, donor: NASH_5, folder: GSM6556462_humanNASH_5_R5C5_20kNoFacsNuclei, condition: disease}
